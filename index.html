<title>Cipher Vault Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --navy:#0b1325; --navy-2:#111c33; --navy-3:#172544; --line:#243760; --line-2:#33508a;
  --cyan:#00f2fe; --cyan-d:#00a9b3; --gold:#ffb703; --gold-d:#c98a00; --red:#ff3b5c; --purple:#b04dff; --green:#10d98a;
  --ink:#eaf2ff; --ink-2:#a9b8d6; --muted:#7485a8;
  --display:"Russo One","Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --ui:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--navy);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:#08101f;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}

/* ===== screens (spec) ===== */
.screen{position:fixed;inset:0;width:100vw;height:100vh;display:none;overflow:hidden;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(ellipse at 50% -10%,rgba(0,242,254,.16),transparent 55%),radial-gradient(ellipse at 110% 110%,rgba(255,183,3,.08),transparent 50%),var(--navy)}
.screen.active{display:flex;flex-direction:column}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,242,254,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,242,254,.045) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
.screen > *{position:relative}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 18px;font-family:var(--ui);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;background:var(--navy-3);border:1px solid var(--line-2);color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 14px rgba(0,242,254,.25)}
.btn.cyan{background:linear-gradient(180deg,#3ff7ff,#00b8c9);color:#021a22;border:0;box-shadow:0 0 22px rgba(0,242,254,.35)}
.btn.gold{background:linear-gradient(180deg,#ffd25a,#e59b00);color:#261800;border:0;box-shadow:0 0 18px rgba(255,183,3,.3)}
.btn.red{background:linear-gradient(180deg,#ff5f7a,#d11f41);color:#fff;border:0}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45}
.hint{color:var(--muted);font-size:13px}
.lbl{display:block;font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}

/* ===== setup ===== */
#screen-setup{align-items:center}
.setup-top{width:100%;display:flex;justify-content:flex-end}
.setup-main{flex:1;min-height:0;width:min(920px,100%);display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,2vh,18px);overflow-y:auto;padding-block:4px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.emblem{width:clamp(70px,13vh,120px);height:auto;filter:drop-shadow(0 0 18px rgba(0,242,254,.45))}
.title{font-family:var(--display);font-size:clamp(26px,5.4vh,52px);line-height:1;margin:0;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance;
  background:linear-gradient(180deg,#ffffff 0%,#cfe0ff 45%,#7f95bf 55%,#e6efff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #0a1a3a) drop-shadow(0 0 16px rgba(0,242,254,.35))}
.subtitle{font-family:var(--ui);font-weight:700;letter-spacing:.35em;text-transform:uppercase;color:var(--cyan);font-size:clamp(12px,1.9vh,16px);text-shadow:0 0 12px rgba(0,242,254,.6)}
.mapel{color:var(--gold);font-family:var(--ui);font-weight:600;font-size:clamp(13px,1.9vh,16px)}
.setup-card{background:linear-gradient(180deg,rgba(23,37,68,.92),rgba(11,19,37,.92));border:1px solid var(--line-2);border-radius:16px;padding:clamp(12px,2.2vh,22px);box-shadow:0 0 0 1px rgba(0,242,254,.12) inset,0 20px 40px rgba(0,0,0,.35);display:grid;grid-template-columns:220px 1fr;gap:18px}
@media (max-width:700px){.setup-card{grid-template-columns:1fr}}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:9px;background:var(--navy-3);border:1px solid var(--line-2);font-size:22px;font-weight:700}
.stepper output{font-family:var(--display);font-size:30px;min-width:46px;text-align:center;color:var(--gold)}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.team-grid .ti{display:flex;align-items:center;gap:8px}
.team-grid i{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:0 0 8px currentColor}
.enter{font-size:clamp(16px,2.4vh,20px);padding:clamp(10px,1.8vh,16px) 28px;width:100%}
.setup-foot{text-align:center;color:var(--muted);font-size:12px;padding-top:4px}
.guru-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(11,19,37,.7);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--ink-2)}
.guru-btn:hover{color:var(--gold);border-color:var(--gold)}

/* ===== arena ===== */
.a-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.a-brand{display:flex;align-items:center;gap:10px;min-width:0}
.a-brand svg{width:44px;height:44px;flex:none}
.a-brand b{font-family:var(--display);font-size:clamp(14px,2.2vh,20px);letter-spacing:.04em;text-transform:uppercase;display:block;line-height:1.05}
.a-brand small{color:var(--cyan);font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.timer-wrap{display:flex;align-items:center;gap:10px}
.timer{font-family:var(--mono);font-weight:700;font-size:clamp(30px,6vh,56px);line-height:1;padding:4px 18px;border-radius:12px;background:#050b18;border:2px solid var(--cyan);color:var(--cyan);text-shadow:0 0 14px rgba(0,242,254,.7);box-shadow:0 0 20px rgba(0,242,254,.25) inset;font-variant-numeric:tabular-nums}
.timer.danger{color:var(--red);border-color:var(--red);text-shadow:0 0 14px rgba(255,59,92,.8);animation:blink 1s steps(2) infinite}
.timer.paused{opacity:.55}
@keyframes blink{50%{opacity:.35}}
.a-tools{display:flex;gap:8px;align-items:center}
.icon-btn{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--navy-3);border:1px solid var(--line-2)}
.icon-btn.big{width:60px;height:60px;border:2px solid var(--cyan);box-shadow:0 0 16px rgba(0,242,254,.3)}
.icon-btn.big.off{border-color:var(--muted);box-shadow:none}
.icon-btn:hover{border-color:var(--gold)}
.a-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(190px,18vw,260px);gap:12px}
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(5px,1vh,10px);min-height:0}
.vault{position:relative;border-radius:12px;background:linear-gradient(160deg,#16264a 0%,#0c1630 100%);border:2px solid var(--lc);box-shadow:0 0 12px color-mix(in srgb,var(--lc) 45%,transparent),0 0 0 1px rgba(255,255,255,.04) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;overflow:hidden;padding:4px;transition:transform .12s,box-shadow .2s}
.vault::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.07) 50%,transparent 65%);pointer-events:none}
.vault:hover:not(:disabled){transform:translateY(-2px) scale(1.02);box-shadow:0 0 22px var(--lc)}
.vault .vn{font-family:var(--ui);font-weight:700;font-size:clamp(10px,1.7vh,15px);letter-spacing:.14em;color:var(--ink-2)}
.vault .vnum{font-family:var(--display);font-size:clamp(18px,4.4vh,40px);line-height:1;color:#fff;text-shadow:0 0 12px var(--lc)}
.vault .vp{font-family:var(--ui);font-weight:700;font-size:clamp(10px,1.6vh,14px);color:var(--lc);letter-spacing:.06em}
.vault.l1{--lc:var(--cyan)} .vault.l2{--lc:var(--gold)} .vault.l3{--lc:#ff4d8d}
.vault.l3{background:linear-gradient(160deg,#2a1640 0%,#140c26 100%)}
.vault.open{background:linear-gradient(160deg,#2a2206,#0f0c02);border-color:var(--gold);box-shadow:0 0 10px rgba(255,183,3,.35);cursor:default}
.vault.open svg{width:clamp(18px,3.4vh,32px);height:auto}
.vault .team-badge{font-family:var(--ui);font-weight:700;font-size:clamp(9px,1.4vh,12px);padding:1px 8px;border-radius:999px;background:var(--tc);color:#08101f;max-width:95%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board{min-height:0;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,rgba(23,37,68,.85),rgba(11,19,37,.85));border:1px solid var(--line-2);border-radius:14px;padding:10px}
.board h3{margin:0;font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-align:center}
.board .list{display:flex;flex-direction:column;gap:6px;overflow:hidden}
.brow{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;background:#0a1328;border:1px solid var(--line);border-left:4px solid var(--tc)}
.brow .r{font-family:var(--display);color:var(--gold);font-size:15px}
.brow .n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .s{font-family:var(--mono);font-weight:700;font-size:18px;color:var(--cyan);font-variant-numeric:tabular-nums}
.brow.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.06);background:#11325a}}
.board .stat{margin-top:auto;font-size:12px;color:var(--ink-2);text-align:center;font-family:var(--ui);letter-spacing:.06em}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:11px;font-family:var(--ui);color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:var(--c);vertical-align:-1px}
@media (max-width:820px){
  .a-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .board{order:-1;padding:6px}.board h3,.board .stat,.legend{display:none}
  .board .list{flex-direction:row;overflow-x:auto}.brow{min-width:130px;padding:4px 8px}
  .vgrid{grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr))}
  .icon-btn{width:44px;height:44px}.icon-btn.big{width:48px;height:48px}
}

/* ===== overlays / modals ===== */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(3,7,16,.84);backdrop-filter:blur(4px)}
.modal{width:min(880px,100%);max-height:calc(100vh - 24px);display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#14223f,#0b1325);border:2px solid var(--cyan);border-radius:18px;padding:clamp(12px,2vh,22px);box-shadow:0 0 40px rgba(0,242,254,.3);overflow:hidden;animation:pop .22s ease-out}
.modal.gold{border-color:var(--gold);box-shadow:0 0 40px rgba(255,183,3,.25)}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.m-title{font-family:var(--display);font-size:clamp(20px,3.6vh,32px);margin:0;letter-spacing:.04em;text-align:center;color:#fff;text-shadow:0 0 14px var(--cyan)}
.m-sub{text-align:center;color:var(--ink-2);font-size:13px;font-family:var(--ui);letter-spacing:.08em;text-transform:uppercase}
.team-pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tp{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:#0a1328;border:2px solid var(--line-2);font-family:var(--ui);font-weight:700;font-size:14px}
.tp i{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.tp[aria-pressed="true"]{border-color:var(--tc);box-shadow:0 0 12px var(--tc);background:#10203f}
.pw{font-family:var(--mono);font-weight:700;font-size:clamp(20px,3.8vh,32px);text-align:center;letter-spacing:.12em;padding:10px;border:2px solid var(--cyan);background:#050b18;color:var(--cyan);text-transform:uppercase}
.kbd{display:flex;flex-direction:column;gap:clamp(4px,.8vh,7px);min-height:0}
.kr{display:flex;gap:clamp(3px,.6vw,7px);justify-content:center}
.key{flex:1 1 0;max-width:68px;height:clamp(34px,6.2vh,54px);border-radius:9px;background:linear-gradient(180deg,#1e3160,#142348);border:1px solid var(--line-2);box-shadow:0 3px 0 #08112a;font-family:var(--ui);font-weight:700;font-size:clamp(14px,2.4vh,20px)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #08112a}
.key.wide{max-width:none;flex:2 1 0}.key.xwide{max-width:none;flex:6 1 0}
.key.act{background:linear-gradient(180deg,#ffd25a,#e59b00);color:#261800;border:0}
.key.warn{background:linear-gradient(180deg,#3a2140,#261530)}
.kbd.bin .key{max-width:none;height:clamp(54px,11vh,90px);font-size:clamp(26px,5vh,40px)}
.m-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.m-actions .btn{min-width:160px}
.shake{animation:shake .5s}
@keyframes shake{15%,55%{transform:translateX(-12px)}35%,75%{transform:translateX(12px)}}

.fx{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px;cursor:pointer}
.fx.ok{background:radial-gradient(circle at 50% 45%,rgba(16,217,138,.95),rgba(0,120,110,.96) 55%,rgba(2,40,44,.98))}
.fx.no{background:radial-gradient(circle at 50% 45%,rgba(200,20,50,.95),rgba(110,0,24,.97) 55%,rgba(30,0,8,.98))}
.fx h2{font-family:var(--display);font-size:clamp(38px,11vh,110px);margin:0;line-height:.95;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 30px rgba(255,255,255,.5);text-wrap:balance}
.fx h3{font-family:var(--display);font-size:clamp(20px,5vh,48px);margin:0;color:#fff}
.fx .pts{font-family:var(--display);font-size:clamp(30px,8vh,80px);color:var(--gold);text-shadow:0 0 22px rgba(255,183,3,.8)}
.fx p{font-family:var(--ui);font-weight:700;font-size:clamp(16px,2.8vh,24px);margin:0;color:#fff;letter-spacing:.06em}
.fx.no .inner{animation:shake .6s}
.fx .inner{display:flex;flex-direction:column;align-items:center;gap:10px;animation:zoom .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes zoom{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#confetti{position:fixed;inset:0;z-index:80;pointer-events:none;width:100vw;height:100vh}

.keylist{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;min-height:0}
.kl{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:6px 9px;border-radius:8px;background:#0a1328;border:1px solid var(--line);font-size:13px}
.kl b{font-family:var(--mono);color:var(--gold)}
.kl .a{font-family:var(--mono);font-weight:700;color:var(--cyan)}
.kl.done{opacity:.5}
.pin{display:flex;gap:10px;justify-content:center}
.pin input{max-width:220px;text-align:center;font-family:var(--mono);font-size:28px;letter-spacing:.4em}
.numpad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center}
.numpad .key{max-width:none;height:54px}

/* ===== gameover ===== */
#screen-gameover{align-items:center;justify-content:center;gap:clamp(8px,2vh,18px)}
.go-title{font-family:var(--display);font-size:clamp(30px,7vh,70px);margin:0;text-align:center;color:var(--gold);text-shadow:0 0 26px rgba(255,183,3,.6)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,22px);width:min(760px,100%);height:clamp(180px,40vh,360px)}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:0}
.pod .nm{font-family:var(--display);font-size:clamp(14px,2.6vh,24px);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-family:var(--mono);font-weight:700;color:var(--cyan);font-size:clamp(14px,2.4vh,22px)}
.pod .blk{width:100%;border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:var(--display);font-size:clamp(30px,7vh,64px);color:#261800;
  background:linear-gradient(180deg,#ffe28a,#ffb703 40%,#a86f00);box-shadow:0 0 30px rgba(255,183,3,.35)}
.pod.p2 .blk{background:linear-gradient(180deg,#f2f6ff,#b8c4dc 45%,#6d7a96);color:#1a2236}
.pod.p3 .blk{background:linear-gradient(180deg,#ffc79a,#d9803a 45%,#7a3f12);color:#2a1300}
.pod .crown{font-size:clamp(22px,4vh,40px);line-height:1}
.go-table{width:min(620px,100%);display:grid;gap:5px}
.go-table .brow{padding:6px 12px}
.go-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ===== teacher dashboard ===== */
#screen-teacher{padding-inline:12px}
.t-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.t-bar h2{font-family:var(--display);font-size:18px;margin:0 8px 0 4px;letter-spacing:.04em;color:var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:9px;background:var(--navy-3);border:1px solid var(--line-2);font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--cyan);color:#021a22;border-color:var(--cyan)}
.t-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.t-body{flex:1;min-height:0;overflow:auto;padding-top:12px}
.preview{display:grid;gap:16px;justify-items:center;padding-bottom:20px}
.pscale{position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);border-radius:2px}
.pscale > .page{position:absolute;top:0;left:0;transform-origin:0 0}
.ed{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start;padding-bottom:30px}
@media (max-width:980px){.ed{grid-template-columns:1fr}}
.panel{background:linear-gradient(180deg,rgba(23,37,68,.9),rgba(11,19,37,.9));border:1px solid var(--line-2);border-radius:14px;padding:14px;display:grid;gap:10px}
.panel h3{margin:0;font-family:var(--ui);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--gold)}
.qrow{display:grid;grid-template-columns:62px minmax(0,1fr) 130px minmax(0,220px);gap:8px;align-items:start;padding:8px;border-radius:10px;background:#0a1328;border:1px solid var(--line);border-left:4px solid var(--lc)}
.qrow.l1{--lc:var(--cyan)}.qrow.l2{--lc:var(--gold)}.qrow.l3{--lc:#ff4d8d}
.qrow .no{font-family:var(--display);font-size:18px;color:var(--lc)}
.qrow .no small{display:block;font-family:var(--ui);font-size:11px;color:var(--muted)}
.qrow textarea{min-height:58px;font-size:13px}
.qrow .kc input{font-family:var(--mono);font-weight:700;color:var(--cyan)}
.qrow .kc .hint{font-size:11px}
@media (max-width:760px){.qrow{grid-template-columns:50px 1fr}.qrow textarea{grid-column:2}.qrow select,.qrow .kc{grid-column:2}}

let audioCtx=null,gainMusikLatar=null,gainEfekSuara=null,noiseBuf=null,musicOn=true,bgmTimer=null,nextNoteTime=0,step=0;
function initAudio(){ // dipanggil HANYA dari handler klik
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audioCtx=new AC();
    gainMusikLatar=audioCtx.createGain();gainMusikLatar.gain.value=.32;gainMusikLatar.connect(audioCtx.destination);
    gainEfekSuara=audioCtx.createGain();gainEfekSuara.gain.value=.9;gainEfekSuara.connect(audioCtx.destination);
    noiseBuf=audioCtx.createBuffer(1,audioCtx.sampleRate*.5,audioCtx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(audioCtx.state==="suspended")audioCtx.resume();
}
const BPM=128,SIX=60/BPM/4;
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; // Am F C G (MIDI)
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(freq,t,dur,type,vol,dest,attack=.005){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02)}
function kick(t){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(gainMusikLatar);o.start(t);o.stop(t+.26)}
function noise(t,dur,vol,hp){const s=audioCtx.createBufferSource();s.buffer=noiseBuf;const f=audioCtx.createBiquadFilter();f.type="highpass";f.frequency.value=hp;const g=audioCtx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(gainMusikLatar);s.start(t);s.stop(t+dur+.02)}
function scheduleStep(s,t){
  const bar=Math.floor(s/16)%4,st=s%16,ch=PROG[bar];
  if(st%4===0)kick(t);
  if(st%4===2)noise(t,.05,.25,7000);
  if(st===4||st===12)noise(t,.14,.35,1500);
  if([0,3,6,8,11,14].includes(st))tone(mtof(ch[0]-24),t,SIX*1.8,"sawtooth",.22,gainMusikLatar);
  if(st%2===0){const n=ch[(st/2)%3]+12+((st%8===6)?12:0);tone(mtof(n),t,SIX*1.6,"square",.07,gainMusikLatar)}
  if(st===0)ch.forEach(n=>tone(mtof(n),t,SIX*14,"triangle",.045,gainMusikLatar,.08));
}
function scheduler(){while(nextNoteTime<audioCtx.currentTime+.12){scheduleStep(step,nextNoteTime);nextNoteTime+=SIX;step++}}
function startBGM(){if(!audioCtx||!musicOn||bgmTimer)return;nextNoteTime=audioCtx.currentTime+.06;bgmTimer=setInterval(scheduler,25)}
function stopBGM(){clearInterval(bgmTimer);bgmTimer=null}
function toggleMusic(){initAudio();musicOn=!musicOn;if(musicOn&&G&&!G.over)startBGM();else stopBGM();renderMusicBtn()}
function renderMusicBtn(){const b=$("#musicBtn");b.classList.toggle("off",!musicOn);b.setAttribute("aria-pressed",String(musicOn));b.title=musicOn?"Musik menyala — klik untuk mematikan":"Musik mati — klik untuk menyalakan";
  b.innerHTML=musicOn?`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="rgba(0,242,254,.2)"/><path d="M16 8.5a5 5 0 0 1 0 7M18.8 6a8.5 8.5 0 0 1 0 12"/></svg>`
  :`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7485a8" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`}
function sfxSuccess(){if(!audioCtx)return;const t=audioCtx.currentTime;[1318.5,1568,2093,2637].forEach((f,i)=>{tone(f,t+i*.08,.9,"sine",.28,gainEfekSuara);tone(f*2,t+i*.08,.4,"sine",.06,gainEfekSuara)})}
function sfxFail(){if(!audioCtx)return;const t=audioCtx.currentTime;tone(110,t,.55,"sawtooth",.35,gainEfekSuara,.01);tone(92,t,.55,"square",.22,gainEfekSuara,.01);tone(98,t+.3,.45,"sawtooth",.3,gainEfekSuara,.01)}
function sfxClick(){if(!audioCtx)return;tone(900,audioCtx.currentTime,.05,"square",.05,gainEfekSuara)}
function sfxFanfare(){if(!audioCtx)return;const t=audioCtx.currentTime;[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,t+i*.14,.5,"triangle",.3,gainEfekSuara))}

/* confetti / fireworks */
function confetti(ms,fireworks){
  const cv=$("#confetti");cv.hidden=false;const ctx=cv.getContext("2d");const W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cols=["#ffb703","#ffd25a","#00f2fe","#ffffff","#ff4d8d","#10d98a"];let parts=[];
  const burst=(x,y,n,sp)=>{for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*(.4+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(fireworks?0:4),g:.12+Math.random()*.08,s:3+Math.random()*5,c:cols[i%cols.length],r:Math.random()*6,life:1,rot:Math.random()*.3})}};
  if(fireworks)burst(W/2,H/3,120,7);else{for(let i=0;i<160;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,g:.05,s:4+Math.random()*6,c:cols[i%cols.length],r:Math.random()*6,life:1,rot:Math.random()*.3})}
  const start=performance.now();let lastB=start;
  const frame=now=>{ctx.clearRect(0,0,W,H);
    if(fireworks&&now-lastB>420&&now-start<ms-800){burst(W*(.15+Math.random()*.7),H*(.15+Math.random()*.4),90,6);lastB=now}
    parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.rot;if(fireworks){p.vx*=.985;p.vy*=.985;p.life-=.012}
      ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    parts=parts.filter(p=>p.y<H+30&&p.life>0);
    if(now-start<ms||parts.length&&now-start<ms+2000)requestAnimationFrame(frame);else{ctx.clearRect(0,0,W,H);cv.hidden=true}};
  requestAnimationFrame(frame);
}

let DL=null,SAMPLE=null;
(async()=>{try{if(window.claude&&window.claude.use){[DL,SAMPLE]=await Promise.all([window.claude.use("downloads"),window.claude.use("sample")])}}catch(e){}

async function saveFile(name,blob){
  if(DL){try{await DL.save({filename:name,data:blob});toast("Tersimpan: "+name);return true}catch(e){const c=e&&e.code;toast(c==="declined"?"Unduhan dibatalkan.":c==="rate_limited"?"Tunggu sebentar lalu coba lagi.":"Unduhan tidak tersedia di tampilan ini.");return false}}
  try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast("Diunduh: "+name);return true}catch(e){toast("Browser menolak unduhan.");return false}
}
const slug=()=>String(DATA.settings.appName||"vault").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
async function capture(pages){
  if(typeof html2canvas==="undefined")throw new Error("lib");
  $("#busy").hidden=false;document.documentElement.classList.add("exporting");const st=$("#stage");st.style.visibility="visible";
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;const out=[];
    for(const p of pages)out.push(await html2canvas(p,{scale:2,useCORS:true,backgroundColor:null,scrollX:0,scrollY:0,windowWidth:1100,logging:false}));return out}
  finally{st.style.visibility="";document.documentElement.classList.remove("exporting");$("#busy").hidden=true}
}
async function exportTab(fmt){
  const kind=tab,name=`${slug()}-${{soal:"lembar-soal",kunci:"kunci-jawaban",lkt:"lembar-kerja"}[kind]}`;
  const pages=buildStage(kind);
  if(fmt==="print"&&!DL){ // browser biasa / Canva: dialog cetak asli
    const after=()=>{buildStage("lkt");removeEventListener("afterprint",after)};addEventListener("afterprint",after);setTimeout(()=>window.print(),80);return}
  try{
    const cv=await capture(pages);
    if(fmt==="png"){const gap=24,w=cv[0].width,h=cv.reduce((a,c)=>a+c.height,0)+gap*(cv.length-1);const o=document.createElement("canvas");o.width=w;o.height=h;const x=o.getContext("2d");x.fillStyle="#9aa3ad";x.fillRect(0,0,w,h);let y=0;cv.forEach(c=>{x.drawImage(c,0,y);y+=c.height+gap});
      await saveFile(name+".png",await new Promise(r=>o.toBlob(r,"image/png")))}
    else{if(!window.jspdf)throw new Error("lib");const pdf=new window.jspdf.jsPDF({orientation:"p",unit:"mm",format:"a4"});cv.forEach((c,i)=>{if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.93),"JPEG",0,0,210,297)});
      if(await saveFile(name+".pdf",pdf.output("blob")))toast("PDF A4 tersimpan. Buka file lalu tekan Print (Ctrl+P).",4500)}
  }catch(e){toast(e&&e.message==="lib"?"Pustaka ekspor belum termuat. Periksa internet lalu coba lagi.":"Gagal membuat file. Coba lagi.")}
  finally{buildStage("lkt")}
}

function warnKey(i){const q=DATA.soal[i],w=$("#kw"+i);if(!w)return;const keys=q.kunci.split(";").map(norm).filter(Boolean);

async function generateAI(){
  if(!SAMPLE)return;const topic=$("#aiTopic").value.trim();if(!topic){toast("Tulis topik materi dulu");return}
  const s=DATA.settings;aiCtl=new AbortController();$("#aiGo").disabled=true;$("#aiStop").hidden=false;$("#aiStop").onclick=()=>aiCtl.abort();
  $("#aiOut").textContent="Claude sedang menyusun 30 soal… (bisa 30–90 detik)";
  const prompt=`Kamu guru ${s.mapel||"IPS"} untuk ${s.target||"siswa SMP"} di Indonesia (Kurikulum Merdeka). Buat TEPAT 30 soal tentang: "${topic}".
Setiap soal jawabannya adalah PASSWORD singkat yang diketik siswa di layar. Aturan:
- Soal 1-10 mudah, 11-20 sedang, 21-30 sulit.
- "tipe" salah satu: "kata" (1 kata), "kalimat" (2-4 kata), "angka" (bilangan desimal), "biner" (hanya digit 0 dan 1; misalnya 4 pernyataan benar=1/salah=0 berurutan, atau konversi bilangan ke biner).
- Minimal 3 soal biner di soal 21-30. Pernyataan biner ditulis di baris baru dengan (a), (b), (c), (d).
- "kunci" = jawaban utama; jika ada jawaban lain yang setara pisahkan dengan titik koma.
- Fakta harus akurat dan sesuai buku IPS SMP. Bahasa Indonesia baku, soal maksimal 45 kata.
Balas HANYA dengan JSON array berisi 30 objek {"q": string, "tipe": string, "kunci": string}.`;
  try{const arr=await SAMPLE.json(prompt,{signal:aiCtl.signal,cache:false});
    if(!Array.isArray(arr)||arr.length<30)throw {code:"short"};
    DATA.soal=arr.slice(0,30);s.tema=topic;fixData();saveData();renderBrand();renderEditor();$("#aiOut").textContent="30 soal baru sudah dibuat. Periksa kunci jawabannya sebelum mencetak.";}
  catch(e){const c=e&&e.code;const msg={cancelled:"Dihentikan.",not_granted:"Izin memakai Claude tidak diberikan.",rate_limited:"Terlalu banyak permintaan. Coba lagi nanti.",short:"Hasil kurang dari 30 soal. Coba lagi.",invalid_json:"Format hasil tidak terbaca. Coba lagi."}[c]||"Gagal membuat soal. Coba lagi.";
    if($("#aiOut"))$("#aiOut").textContent=msg;if(c==="not_granted"||c==="sampling_disabled"){const b=$("#aiBox");if(b)b.hidden=true}}
  finally{if($("#aiGo")){$("#aiGo").disabled=false;$("#aiStop").hidden=true}}
}
